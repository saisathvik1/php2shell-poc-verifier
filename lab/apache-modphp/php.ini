; Settings the mod_php ASLR-bypass chain requires on the target, per the
; upstream exploit's own documented requirements (display_errors=1,
; memory_limit=8M, max_input_vars=1000, session.use_cookies=1,
; session.use_strict_mode=0, session.upload_progress.enabled=1).
; Same shape as the lab config in kaaangumus/php2shell-kit - see README.

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
memory_limit = 8M
max_input_vars = 1000
post_max_size = 64M
upload_max_filesize = 64M
session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
