# A single prefork worker, no concurrency at all. The exploit chain needs a
# worker it can crash-and-respawn (ex.rotate()) into a predictable state;
# more than one worker turns that into an unaddressable race. Same shape as
# the lab config in kaaangumus/php2shell-kit - see README.
KeepAlive Off
<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
